name: Build Control del Chofer APK

on:
  push:
    branches: [control-chofer-android]
    paths:
      - 'control-chofer-android/**'
      - '.github/workflows/build-control-chofer-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-chofer-android
    steps:
      - uses: actions/checkout@v4

      - name: Usar login v3 como pantalla inicial
        run: cp www/login-v3.html www/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: control-chofer-android/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Add Android location permissions and version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n'''
          if 'ACCESS_BACKGROUND_LOCATION' not in s:
              s=s.replace('<application',perms+'\n    <application',1)
          p.write_text(s)
          g=Path('android/app/build.gradle')
          t=g.read_text()
          t=t.replace('versionCode 1','versionCode 3')
          t=t.replace('versionName "1.0"','versionName "1.2"')
          g.write_text(t)
          PY

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Control-del-Chofer-Android-v3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Control-del-Chofer-Android-APK-v3
          path: control-chofer-android/Control-del-Chofer-Android-v3.apk
          if-no-files-found: error
