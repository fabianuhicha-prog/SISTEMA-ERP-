name: Build APK CHOFER Android

on:
  push:
    branches: [APK-CHOFER]
    paths:
      - 'control-chofer-android/**'
      - '.github/workflows/build-control-chofer-apk.yml'
  workflow_dispatch:

concurrency:
  group: apk-chofer-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-chofer-android
    steps:
      - uses: actions/checkout@v4

      - name: Preparar navegación Android
        run: |
          cp www/login-v3.html www/index.html
          python - <<'PY'
          from pathlib import Path
          for name in ['carrera.html','movimientos.html','analisis.html','ajustes.html']:
              p=Path('www')/name
              if not p.exists():
                  continue
              s=p.read_text()
              s=s.replace('<i>▣</i>Movimientos','<i>▣</i>Ingresos/Gastos')
              if 'reportes.html' not in s:
                  normal='<a href="ajustes.html"><i>⚙</i>Ajustes</a>'
                  active='<a class="active" href="ajustes.html"><i>⚙</i>Ajustes</a>'
                  if active in s:
                      s=s.replace(active,'<a href="reportes.html"><i>▤</i>Reportes</a>'+active)
                  elif normal in s:
                      s=s.replace(normal,'<a href="reportes.html"><i>▤</i>Reportes</a>'+normal)
              p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: control-chofer-android/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Configurar firma estable de pruebas APK CHOFER
        run: |
          base64 -d signing/apk-chofer-debug.keystore.b64 > android/app/apk-chofer-debug.keystore
          chmod 600 android/app/apk-chofer-debug.keystore
          keytool -list -v -keystore android/app/apk-chofer-debug.keystore -storepass android -alias androiddebugkey | grep -E 'Owner:|SHA256:'

      - name: Add Android permissions, stable signing and version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n'''
          if 'ACCESS_BACKGROUND_LOCATION' not in s:
              s=s.replace('<application',perms+'\n    <application',1)
          p.write_text(s)

          g=Path('android/app/build.gradle')
          t=g.read_text()
          if 'apk-chofer-debug.keystore' not in t:
              block='''android {\n    signingConfigs {\n        debug {\n            storeFile file('apk-chofer-debug.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }'''
              t=t.replace('android {',block,1)
          t=t.replace('versionCode 1','versionCode 6')
          t=t.replace('versionName "1.0"','versionName "1.5"')
          g.write_text(t)
          PY

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK certificate and rename
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk APK-CHOFER-v6.apk
          rm -rf /tmp/apkcert && mkdir -p /tmp/apkcert
          unzip -qq APK-CHOFER-v6.apk 'META-INF/*' -d /tmp/apkcert
          CERT=$(find /tmp/apkcert -type f \( -name '*.RSA' -o -name '*.DSA' -o -name '*.EC' \) | head -n1)
          keytool -printcert -file "$CERT" | grep -E 'Owner:|SHA256:'
          keytool -printcert -file "$CERT" | grep 'CN=APK CHOFER'

      - uses: actions/upload-artifact@v4
        with:
          name: APK-CHOFER-v6-GPS-VEHICULO
          path: control-chofer-android/APK-CHOFER-v6.apk
          if-no-files-found: error
