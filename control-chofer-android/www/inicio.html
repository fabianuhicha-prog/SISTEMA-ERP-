<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243f"><title>Inicio · Control del Chofer</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header class="app-header"><div class="head-row"><div class="brand"><b>Control del Chofer</b><small id="vehicleHead">GPS y rentabilidad</small></div><div class="userbox"><b id="headUser"></b><a class="logout" href="login-v3.html" onclick="CC.logout();return false">Salir</a></div></div></header><nav class="topnav"><a class="active" href="inicio.html"><i>⌂</i>Inicio</a><a href="carrera.html"><i>▶</i>Carrera</a><a href="movimientos.html"><i>▣</i>Movimientos</a><a href="analisis.html"><i>▥</i>Análisis</a><a href="ajustes.html"><i>⚙</i>Ajustes</a></nav><main><h1 id="hello">Resumen del día</h1><p class="sub">Información guardada en este teléfono.</p><div class="card goal">Meta diaria <b id="goal">$0.00</b><div class="progress"><i id="goalbar"></i></div><small id="goalmsg"></small></div><div class="kpis"><div class="kpi"><small>Ingresos</small><b id="gross">$0.00</b></div><div class="kpi"><small>Gastos</small><b id="costs">$0.00</b></div><div class="kpi"><small>Ganancia neta</small><b id="net">$0.00</b></div><div class="kpi"><small>Kilómetros</small><b id="km">0 km</b></div><div class="kpi"><small>Viajes</small><b id="trips">0</b></div><div class="kpi"><small>Costo/km</small><b id="cpk">$0.00</b></div></div><div class="cols" style="margin-top:12px"><div class="card"><h2>Mapa de actividad</h2><div id="dashmap" class="map"></div></div><div class="card"><h2>Últimas carreras</h2><div id="recent"></div></div></div></main><script src="core.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script><script>if(CC.requireUser()){CC.head();CC.seedIfEmpty();const u=CC.user(),s=CC.daySummary();document.getElementById('hello').textContent='¡Hola, '+u.name.split(' ')[0]+'!';goal.textContent=CC.money(u.vehicle.goal);goalbar.style.width=Math.min(100,u.vehicle.goal?s.gross/u.vehicle.goal*100:0)+'%';goalmsg.textContent=s.gross>=u.vehicle.goal?'Meta alcanzada':'Faltan '+CC.money(Math.max(0,u.vehicle.goal-s.gross));gross.textContent=CC.money(s.gross);costs.textContent=CC.money(s.cost);net.textContent=CC.money(s.net);km.textContent=s.km.toFixed(1)+' km';trips.textContent=s.count;cpk.textContent=CC.money(s.km?s.cost/s.km:0);let rs=[...CC.trips()].sort((a,b)=>(b.startTime||'').localeCompare(a.startTime||'')).slice(0,7);recent.innerHTML=rs.length?rs.map(x=>'<div class="listrow"><span><b>'+x.platform+'</b><br><small>'+(x.startLabel||'Origen')+' → '+(x.endLabel||'Destino')+'</small></span><b>'+CC.money(Number(x.base||x.baseIncome||0)+Number(x.extra||x.extraIncome||0))+'</b></div>').join(''):'<p class="sub">Todavía no hay carreras.</p>';try{if(window.L){let m=L.map('dashmap').setView([-0.24,-78.48],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);let pts=[];CC.trips().forEach(t=>(t.route||[]).forEach(p=>pts.push([p[0],p[1],.55])));if(pts.length&&L.heatLayer){L.heatLayer(pts,{radius:18,blur:16}).addTo(m);m.fitBounds(pts.map(p=>[p[0],p[1]]),{padding:[10,10]})}}}catch(e){console.error(e)}}</script></body></html>
