<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243f"><title>Ajustes · Control del Chofer</title><link rel="stylesheet" href="style.css"></head><body><header class="app-header"><div class="head-row"><div class="brand"><b>Control del Chofer</b><small id="vehicleHead"></small></div><div class="userbox"><b id="headUser"></b><a class="logout" href="login-v3.html" onclick="CC.logout();return false">Salir</a></div></div></header><nav class="topnav"><a href="inicio.html"><i>⌂</i>Inicio</a><a href="carrera.html"><i>▶</i>Carrera</a><a href="movimientos.html"><i>▣</i>Movimientos</a><a href="analisis.html"><i>▥</i>Análisis</a><a class="active" href="ajustes.html"><i>⚙</i>Ajustes</a></nav><main><h1>Ajustes</h1><p class="sub">Vehículo, combustible, meta diaria y usuarios.</p><div class="card"><h2>Mi vehículo</h2><div class="grid2"><div><label>Tipo de carro</label><select id="vType"><option>Automóvil</option><option>SUV</option><option>Camioneta</option><option>Taxi</option><option>Van</option><option>Otro</option></select></div><div><label>Color</label><input id="vColor"></div><div><label>Modelo</label><input id="vModel"></div><div><label>Placa</label><input id="vPlate"></div><div><label>Meta diaria</label><input id="vGoal" type="number" step=".01"></div><div><label>Tanque lleno ($)</label><input id="vFuelFill" type="number" step=".01"></div><div><label>Rendimiento por tanque (km)</label><input id="vFuelRange" type="number"></div></div><button class="btn btn-dark" onclick="CC.saveVehicle()">Guardar configuración</button></div><div id="adminPanel" class="card hidden"><h2>Crear usuario / chofer</h2><div class="grid2"><div><label>Nombre</label><input id="newName"></div><div><label>Usuario</label><input id="newUser"></div><div><label>Contraseña</label><input id="newPass" type="password"></div><div><label>Tipo de carro</label><input id="newType" value="Automóvil"></div><div><label>Color</label><input id="newColor" value="Gris"></div><div><label>Modelo</label><input id="newModel"></div><div><label>Placa</label><input id="newPlate"></div></div><button class="btn btn-dark" onclick="CC.createUser()">Crear chofer</button><div id="users"></div></div><div class="card"><h2>Respaldo</h2><button class="btn btn-soft" onclick="CC.exportData()">Descargar respaldo JSON</button></div></main><script src="core.js"></script><script>if(CC.requireUser()){CC.head();let u=CC.user(),v=u.vehicle;vType.value=v.type;vColor.value=v.color;vModel.value=v.model;vPlate.value=v.plate;vGoal.value=v.goal;vFuelFill.value=v.fuelFill;vFuelRange.value=v.fuelRange;if(u.role==='admin'){adminPanel.classList.remove('hidden');users.innerHTML='<h2 style="margin-top:18px">Usuarios registrados</h2>'+CC.state().users.map(x=>'<div class="admin-user"><b>'+x.name+'</b> · '+x.username+'<small>'+x.role+' · '+x.vehicle.type+' '+x.vehicle.model+' · '+x.vehicle.color+' · '+x.vehicle.plate+'</small></div>').join('')}}</script></body></html>
