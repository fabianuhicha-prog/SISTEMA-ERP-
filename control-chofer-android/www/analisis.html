<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243f"><title>Análisis · Control del Chofer</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header class="app-header"><div class="head-row"><div class="brand"><b>Control del Chofer</b><small id="vehicleHead"></small></div><div class="userbox"><b id="headUser"></b><a class="logout" href="login-v3.html" onclick="CC.logout();return false">Salir</a></div></div></header><nav class="topnav"><a href="inicio.html"><i>⌂</i>Inicio</a><a href="carrera.html"><i>▶</i>Carrera</a><a href="movimientos.html"><i>▣</i>Movimientos</a><a class="active" href="analisis.html"><i>▥</i>Análisis</a><a href="ajustes.html"><i>⚙</i>Ajustes</a></nav><main><h1>Análisis</h1><p class="sub">Plataformas, rutas y zonas más recorridas.</p><div class="cols"><div class="card"><h2>Mapa de calor / rutas</h2><div id="analysisMap" class="map"></div></div><div><div class="card"><h2>Resumen por plataforma</h2><div id="platformStats"></div></div><div class="card"><h2>Rutas más usadas</h2><div id="routeStats"></div></div></div></div></main><script src="core.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script><script>if(CC.requireUser()){CC.head();let ps={},rs={};CC.trips().forEach(t=>{let inc=Number(t.base||t.baseIncome||0)+Number(t.extra||t.extraIncome||0);ps[t.platform]=ps[t.platform]||{n:0,inc:0,km:0};ps[t.platform].n++;ps[t.platform].inc+=inc;ps[t.platform].km+=Number(t.distance||0);let r=(t.startLabel||'Origen')+' → '+(t.endLabel||'Destino');rs[r]=(rs[r]||0)+1});let pa=Object.entries(ps).sort((a,b)=>b[1].inc-a[1].inc),mx=Math.max(1,...pa.map(x=>x[1].inc));platformStats.innerHTML=pa.length?pa.map(([k,v])=>'<div class="listrow"><span><b>'+k+'</b><br><small>'+v.n+' viajes · '+v.km.toFixed(1)+' km</small><div class="statbar"><i style="width:'+(v.inc/mx*100)+'%"></i></div></span><b>'+CC.money(v.inc)+'</b></div>').join(''):'<p class="sub">Sin datos.</p>';routeStats.innerHTML=Object.entries(rs).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([r,n])=>'<div class="listrow"><span>'+r+'</span><b>'+n+' viajes</b></div>').join('')||'<p class="sub">Sin datos.</p>';try{if(window.L){let m=L.map('analysisMap').setView([-0.24,-78.48],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);let pts=[];CC.trips().forEach(t=>(t.route||[]).forEach(p=>pts.push([p[0],p[1],.55])));if(pts.length&&L.heatLayer){L.heatLayer(pts,{radius:22,blur:19}).addTo(m);m.fitBounds(pts.map(p=>[p[0],p[1]]),{padding:[10,10]})}}}catch(e){console.error(e)}}</script></body></html>
